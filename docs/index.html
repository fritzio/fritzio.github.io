<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabian Fritz - Portfolio</title>
    <meta name="description" content="DPhil student at Oxford studying Machine Learning and AI Safety">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-global-bg text-global-text antialiased">
    <!-- Fixed Header -->
    <header id="main-header" class="group">
        <div class="header-grid">
            <!-- Title -->
            <div class="header-title">
                <span class="text-xl font-bold sm:text-2xl">Fabian Fritz</span>
            </div>

            <!-- Desktop Navigation -->
            <nav class="mobile-nav-menu header-nav sm:flex sm:flex-row sm:items-center" id="navigation-menu">
                <a href="#about">About</a>
                <!-- <a href="#news">News</a> -->
                <a href="#publications">Publications</a>
                <a href="#resources">Resources</a>
                <a href="#gallery">Gallery</a>
                <a href="#resume">Résumé</a>
            </nav>

            <!-- Controls -->
            <div class="header-controls flex items-center gap-3">
                <!-- Mobile Menu Toggle -->
                <button id="toggle-navigation-menu" class="flex h-7 w-7 items-center justify-center rounded-md border border-accent-2/20 bg-accent-2/10 p-1 transition-colors hover:bg-accent-2/20 sm:hidden" aria-expanded="false" aria-label="Toggle navigation menu">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-3xl px-4 sm:px-8">
        <!-- About Section -->
        <section id="about" class="mb-16">
            <div class="prose" id="about-content">
                <div class="loading-spinner">Loading about content...</div>
            </div>
        </section>

        <!-- News Section -->
        <!-- <section id="news" class="mb-16">
            <div class="prose" id="news-content">
                <div class="loading-spinner">Loading news content...</div>
            </div>
        </section> -->

        <!-- Publications Section -->
        <section id="publications" class="mb-16">
            <div class="prose" id="publications-content">
                <div class="loading-spinner">Loading publications content...</div>
            </div>
        </section>

        <!-- Resources Section -->
        <section id="resources" class="mb-16">
            <div class="prose" id="resources-content">
                <div class="loading-spinner">Loading resources content...</div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section id="gallery" class="mb-16">
            <div class="prose" id="gallery-content">
                <div class="loading-spinner">Loading gallery content...</div>
            </div>
        </section>

        <!-- Resume Section -->
        <section id="resume" class="mb-16">
            <div class="prose" id="resume-content">
                <div class="loading-spinner">Loading resume content...</div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div class="mx-auto max-w-3xl px-4 sm:px-8 py-8 text-center text-sm opacity-75">
        <p>Theme from <a href="https://jrosser.co.uk" class="cactus-link">J Rosser</a></p>
    </div>

    <!-- Gallery Lightbox -->
    <div id="gallery-lightbox" class="gallery-lightbox">
        <div class="gallery-lightbox-inner">
            <button id="gallery-lightbox-close" class="gallery-lightbox-close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
            <div id="gallery-lightbox-content" class="gallery-lightbox-content"></div>
            <div id="gallery-lightbox-caption" class="gallery-lightbox-caption"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
